# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
    restart: unless-stopped
    depends_on:
      - meilisearch
    environment:
      MEILI_ADDR: http://meilisearch:7700
      # Both are the platform's per-install secrets. The search key is the
      # same name as in the meilisearch service, so both get the same value.
      NEXTAUTH_SECRET: "${secret:nextauth-secret}"
      MEILI_MASTER_KEY: "${secret:meili-master-key}"
      NEXTAUTH_URL: http://localhost:3000
      # The database is ${DATA_DIR}/db.db, so it lives in the volume only with this set, as in upstream's compose.
      DATA_DIR: /data
      DISABLE_NEW_RELEASE_CHECK: "true"
      # Bookmark crawling wants a headless Chrome sidecar upstream ships
      # separately; without it link previews degrade but the app runs.
      CRAWLER_ENABLED: "false"
    volumes:
      - karakeep-data:/data
    ports:
      - "3000:3000"

  meilisearch:
    image: getmeili/meilisearch:v1.56.1@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${secret:meili-master-key}"
      # meilisearch refuses to open an index written by any other engine
      # version, and Renovate bumps the image. This lets it migrate the index
      # in place on start (meilisearch's documented dumpless upgrade). It does
      # nothing on an empty volume or when the versions already match.
      MEILI_UPGRADE_DB: "true"
    volumes:
      - karakeep-meili:/meili_data

volumes:
  karakeep-data:
  karakeep-meili:
