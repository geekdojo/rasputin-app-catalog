# Version is provisional — the ACC-1 bench gate re-pins before ship. The DIGEST is
# what actually fixes the contents: a tag is mutable at the registry however
# specific it looks, so the tag here is human-readable sugar and the digest is the
# pin (ADR-0006 Decision 8).
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - jellyfin-media:/media
    ports:
      - "8096:8096"

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellyfin-media:
