# HELD ON 1.x DELIBERATELY. Upstream's latest is 2.5.0, and it is far worse on
# supply chain: 1475 fixable HIGH/CRITICAL against 176 on this pin (measured
# 2026-08-19). v2 is also a major version whose migration needs a bench, so
# moving is a decision rather than a version bump. Tracked separately.
#
# Version is provisional — the ACC-1 bench gate re-pins before ship. The DIGEST is
# what actually fixes the contents: a tag is mutable at the registry however
# specific it looks, so the tag here is human-readable sugar and the digest is the
# pin (ADR-0006 Decision 8).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"

volumes:
  uptime-kuma-data:
