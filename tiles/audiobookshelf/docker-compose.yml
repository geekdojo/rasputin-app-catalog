# Version is provisional — the ACC-1 bench gate re-pins before ship. The DIGEST is
# what actually fixes the contents: a tag is mutable at the registry however
# specific it looks, so the tag here is human-readable sugar and the digest is the
# pin (ADR-0006 Decision 8).
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    restart: unless-stopped
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
      - abs-audiobooks:/audiobooks
      - abs-podcasts:/podcasts
    ports:
      - "13378:80"

volumes:
  abs-config:
  abs-metadata:
  abs-audiobooks:
  abs-podcasts:
