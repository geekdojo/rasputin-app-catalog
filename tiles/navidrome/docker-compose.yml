# Version is provisional — the ACC-1 bench gate re-pins before ship. The DIGEST is
# what actually fixes the contents: a tag is mutable at the registry however
# specific it looks, so the tag here is human-readable sugar and the digest is the
# pin (ADR-0006 Decision 8).
services:
  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
      - navidrome-music:/music:ro
    ports:
      - "127.0.0.1:4533:4533"

volumes:
  navidrome-data:
  navidrome-music:
