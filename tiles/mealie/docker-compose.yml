# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "false"
      TZ: UTC
    volumes:
      - mealie-data:/app/data
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  mealie-data:
