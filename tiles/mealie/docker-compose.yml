# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "false"
      TZ: UTC
    volumes:
      - mealie-data:/app/data
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  mealie-data:
