# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  minecraft:
    image: itzg/minecraft-server:2026.8.2@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
    restart: unless-stopped
    environment:
      # Mojang's EULA (https://aka.ms/MinecraftEULA). The server refuses to
      # start without this; accepting it here means the catalog accepts on the
      # owner's behalf at install time.
      EULA: "TRUE"
      # The game version is pinned SEPARATELY from the image, and both are
      # load-bearing. itzg/minecraft-server downloads the Minecraft server
      # build at first run, so a digest-pinned image running VERSION=LATEST
      # still hands two owners different servers a month apart — and a client
      # cannot join a server it does not match, while a world opened by a newer
      # build is not reliably readable by an older one.
      #
      # 26.2 is Mojang's current release (version_manifest_v2.json, released
      # 2026-06-16). Raising this pin later changes a running install's server
      # on its next deploy, against an existing world, so it is a deliberate
      # act rather than routine maintenance.
      VERSION: "26.2"
      TYPE: "VANILLA"
      MEMORY: "2G"
    volumes:
      - minecraft-data:/data
    ports:
      - "25565:25565"

volumes:
  minecraft-data:
