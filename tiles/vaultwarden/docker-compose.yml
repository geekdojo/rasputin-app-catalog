# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: unless-stopped
    environment:
      # Signups stay open only until the owner creates their account; close it
      # from the admin page after first login.
      SIGNUPS_ALLOWED: "true"
    volumes:
      - vaultwarden-data:/data
    ports:
      - "8083:80"

volumes:
  vaultwarden-data:
