# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: unless-stopped
    environment:
      # Sign-ups are closed. The owner sets the admin page token as this app's
      # operator secret, signs in to /admin with it, invites their own email
      # and signs up with that email. With no token set the admin page is
      # disabled and nobody can register, so the vault fails closed.
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: "${secret:admin-token}"
    volumes:
      - vaultwarden-data:/data
    ports:
      - "127.0.0.1:8083:80"

volumes:
  vaultwarden-data:
