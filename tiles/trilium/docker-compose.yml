# The DIGEST is the pin — a tag stays mutable at the registry however specific it
# looks, so the tag here is human-readable sugar (ADR-0006 Decision 8). Version is
# provisional until the tile clears the hardware bench.
services:
  trilium:
    image: ghcr.io/triliumnext/notes:v0.90.4@sha256:490ec7bec8e39b9020afa01efc5e33a04310362a9e1f780ded7fff83833e0961
    restart: unless-stopped
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    volumes:
      - trilium-data:/home/node/trilium-data
    ports:
      - "8080:8080"

volumes:
  trilium-data:
