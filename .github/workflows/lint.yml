name: lint

# NO `paths:` FILTER ON pull_request, deliberately. Both PR jobs here are
# REQUIRED status checks, and a required check that never runs does not pass —
# it stays pending, and the PR is blocked forever with no way to clear it. A
# path filter on a workflow whose jobs are required is therefore a trap: it
# works for every PR that touches the filtered paths and silently wedges the
# first one that does not (a README edit, a LICENSE fix).
#
# The cost of always running is small and bounded: tilescan compares the tile
# images against the base ref first and exits immediately when none changed, so
# a docs PR pays for a checkout and a Go build, not a vulnerability scan.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, and deliberately NOT on every PR: the arch probe below talks to
    # Docker Hub and ghcr, and a PR gate that depends on two third-party
    # registries fails for reasons the contributor cannot fix. The offline
    # corpus test is the PR gate; this catches an upstream that drops an
    # architecture out from under a pin.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: tile corpus (offline)
        run: go test ./... && go run ./cmd/tilelint

  workflows:
    # zizmor audits the workflows themselves. It is a REQUIRED check and not an
    # advisory one, because the class of bug it finds is invisible in review:
    # its first run on this repo found a template injection in the job directly
    # below — `origin/${{ github.base_ref }}` inline in a run block — in the same
    # repo whose intake workflow carries three paragraphs on why never to do
    # that. Discipline written in comments does not hold; a gate does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: audit the workflows
        run: |
          pip install --quiet zizmor==1.29.0
          zizmor --format plain .github/workflows/

  supply-chain:
    # Gates on the app's OWN dependency count not rising, comparing the old and
    # new pin IN THE SAME RUN so the CVE database is identical for both sides.
    # Comparing against a stored number would fail for reasons no PR caused.
    #
    # Always runs on a PR so it can be a required check (see the trigger note).
    # tilescan exits immediately when no tile image changed, so a docs PR does
    # not pay for a scan — but a PR that DOES change a tile cannot merge without
    # one, which is the rule: you may not alter a tile you cannot verify.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Pin the TOOL as well as the action. setup-trivy installs
          # "latest" by default, so a scan result would depend on when it
          # ran — and the supply-chain gate compares two scans expecting
          # the same engine on both sides.
          version: v0.74.0
      - name: app-level vulnerabilities must not increase
        # BASE_REF via env, not interpolated into the run block. A branch name
        # is attacker-influenced text and git permits characters a shell will
        # act on, so `origin/${{ github.base_ref }}` inline is the same template
        # injection this repo's intake workflow was written to avoid. Caught by
        # zizmor on its first run, in the one file that had lectured about it.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./cmd/tilescan -baseline "origin/$BASE_REF"

  version:
    # A PR that changes the corpus must bump VERSION. The catalog version is
    # monotonic (ADR-0006 Decision 5) and the source of truth is a tracked file
    # bumped by PR — reviewable in a diff, which is why it was chosen over
    # deriving the number at publish time. The cost of a reviewable file is
    # that it can be forgotten, so this is the gate that makes it safe.
    #
    # Only fires when tiles/ actually changed: a README or workflow edit has
    # nothing to publish and must not demand a version.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a corpus change must bump VERSION
        # BASE_REF through env, never interpolated into the script — same
        # reasoning as the supply-chain job above.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          base="origin/$BASE_REF"
          if git diff --quiet "$base"...HEAD -- tiles/; then
            echo "tiles/ unchanged — no version bump required."
            exit 0
          fi
          have="$(tr -d '[:space:]' < VERSION)"
          # A base ref predating the VERSION file reads as 0, so the very first
          # corpus PR after it lands is not blocked by its own absence.
          want="$(git show "$base:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$want" ] || want=0
          case "$have" in ''|*[!0-9]*) echo "::error::VERSION must be a positive integer, got '$have'"; exit 1;; esac
          echo "tiles/ changed. VERSION on $BASE_REF is $want; on this branch it is $have."
          if [ "$have" -le "$want" ]; then
            echo "::error::This PR changes tiles/ but does not raise VERSION above $want."
            echo "::error::Every corpus change is a new catalog, and a cluster refuses a bundle whose version does not exceed the one it holds — so an unbumped corpus publishes an artifact the whole fleet ignores."
            exit 1
          fi

  arch:
    # Registry-dependent, so it runs on a schedule and on main rather than
    # gating a contributor's PR on Docker Hub's availability.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - name: architecture claims match the registries
        run: go run ./cmd/tilelint -arch
