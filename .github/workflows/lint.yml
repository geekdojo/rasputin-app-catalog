name: lint

on:
  pull_request:
    paths:
      - "tiles/**"
      - "provenance/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
  schedule:
    # Weekly, and deliberately NOT on every PR: the arch probe below talks to
    # Docker Hub and ghcr, and a PR gate that depends on two third-party
    # registries fails for reasons the contributor cannot fix. The offline
    # corpus test is the PR gate; this catches an upstream that drops an
    # architecture out from under a pin.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: tile corpus (offline)
        run: go test ./... && go run ./cmd/tilelint

  supply-chain:
    # Gates on the app's OWN dependency count not rising, comparing the old and
    # new pin IN THE SAME RUN so the CVE database is identical for both sides.
    # Comparing against a stored number would fail for reasons no PR caused.
    #
    # Runs only when tiles change: you may not alter a tile you cannot verify,
    # but a docs PR should not be hostage to Docker Hub.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: aquasecurity/setup-trivy@v0.2.0
      - name: app-level vulnerabilities must not increase
        run: go run ./cmd/tilescan -baseline origin/${{ github.base_ref }}

  arch:
    # Registry-dependent, so it runs on a schedule and on main rather than
    # gating a contributor's PR on Docker Hub's availability.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: architecture claims match the registries
        run: go run ./cmd/tilelint -arch
