name: catalog-release

# Builds the signed catalog bundle (ADR-0006 Decision 2) and publishes it as a
# GitHub release asset. The control plane fetches and verifies it (#160).
#
# TWO JOBS, DELIBERATELY SPLIT.
#
# `build` runs on every push to main and every PR. It proves the bundle path
# continuously and needs no secrets.
#
# `publish` runs on push to main and on a manual dispatch FROM MAIN. A dispatch
# from any other branch runs `build` and skips `publish`. It was dispatch-only
# until 2026-08-21, while the catalog signing leaf did not exist — it needed an
# EKU under a real IANA PEN. PEN 66587 was assigned 2026-08-20 and
# catalog-leaf-001 is now in this repo's secrets, so a merge to main publishes.
#
# Every merge to main that CHANGES THE CORPUS publishes a new catalog version.
# That is the point of the whole epic — apps arrive without a firmware upgrade —
# and it is safe because the `version` job in lint.yml refuses a corpus change
# that does not bump VERSION, and this job refuses to republish or go backwards.
#
# A merge that changes no tiles has nothing to publish and says so, rather than
# failing: docs and workflow commits are the common case on this repo, and a
# publish job that is routinely red for them is a publish job nobody reads.
#
# CHANNELS, AND HOW A VERSION REACHES STABLE.
#
# The channel is the GitHub prerelease flag and nothing else (ADR-0006
# Decision 9). The bundle carries no channel field, and the control plane's
# fetch reads that flag alone. A stable cluster takes full releases only. A
# dev cluster takes the highest catalog-vN of either kind, prerelease or full,
# from a control-plane build that includes rasputin-control-plane#269 onward;
# on an older build it takes prereleases only. A push to main publishes
# catalog-v<VERSION> as a prerelease, so a new version reaches dev only.
#
# To promote a version that dev has already tested, flip the flag on the
# release that already exists:
#
#   gh release edit catalog-vN --prerelease=false --latest
#
# That makes it a full release, which both channels take, and ships the
# tested, signed bytes unchanged. --latest is part of the procedure: GitHub
# does not reliably move "Latest" to the promoted release on its own
# (catalog-v26 stayed behind v25 without it), and Latest must always name
# the newest normal release. Clusters never read Latest; people do. A channel=stable dispatch of
# this workflow cannot do it. The gate below compares VERSION against every
# published catalog-v* tag, prerelease or not, and dev always publishes the
# number first on merge, so the dispatch fails with "Bump VERSION in a PR".
# Bumping VERSION would re-sign and publish a NEW version from whatever main
# holds at that moment, not the one dev tested. A channel=stable dispatch is
# only for publishing a VERSION that is not yet published straight to stable.
#
# Promoting marks the release "Latest" on GitHub even when make_latest=false
# is sent (nothing reads that marker). It does not take the version away from
# dev, because dev takes full releases too. The exception is a cluster on a
# control-plane build that predates rasputin-control-plane#269: there, a dev
# cluster that has not yet fetched the promoted version falls back to the
# highest remaining prerelease until the next corpus merge publishes a newer
# one. ADR-0006's 2026-09-11 note and amendment under Decision 9 have the
# details.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel for a VERSION not yet published. dev publishes as a prerelease. Publishes only when run from main. This cannot promote a published version: run gh release edit catalog-vN --prerelease=false instead (see the header)."
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build the catalog bundle
        env:
          # Bound through env, never interpolated into the script body — a
          # `${{ }}` expansion inside `run:` is a template-injection sink, and
          # this repo's own intake workflow lectures about exactly that.
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          # Reproducible: the same commit must build byte-identical output, so
          # the timestamp comes from the commit rather than the clock.
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          go run ./cmd/catalogbundle -version "$version" -source "$SOURCE" -o catalog.json
          echo "----- catalog.json (head) -----"
          head -c 400 catalog.json; echo

      - name: Prove the build is reproducible
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          go run ./cmd/catalogbundle -version "$version" -source "${GITHUB_REPOSITORY}@${GITHUB_SHA}" -o catalog-again.json
          cmp catalog.json catalog-again.json \
            || { echo "::error::two builds of one commit differ — the bundle is not reproducible"; exit 1; }
          rm -f catalog-again.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-bundle
          path: catalog.json
          if-no-files-found: error

  publish:
    # Only from main. A PR must never publish: its head is untrusted content by
    # definition, and this job holds the signing key. The event check alone
    # did not say "main": a dispatch runs on whichever branch the dispatcher
    # picks, so an unreviewed branch could be signed and published. The ref
    # check closes that. A push reaches this job only from main (see `on:`),
    # and a pull_request run fails the event check whatever its ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    # The catalog signing credential lives in this repository's `signing`
    # ENVIRONMENT, not in repository- or organisation-level secrets
    # (geekdojo/geekdojo-brain#524). Naming the environment here is what makes
    # its secrets reachable at all, and what makes its deployment-branch policy
    # apply, so the ref check above is backed by the platform and not only by
    # this file.
    environment: signing
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Needed to diff this push against its predecessor in the gate below.
          fetch-depth: 0

      # The exact commit this job checked out, which "Build and sign" bundles
      # and signs. The release tag must land HERE, not on whatever main points
      # at when the publish step runs: with no explicit target, GitHub creates
      # a new tag from the default branch at publish time, so a merge landing
      # mid-run would tag a commit this bundle was never built from.
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Is there anything to publish?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through env, never interpolated into the script body — same
          # template-injection reasoning as the build job above.
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in ''|*[!0-9]*) echo "::error::VERSION must be a positive integer, got '$version'"; exit 1;; esac

          # Decision 5 is enforced at the CLUSTER, but a publisher that can emit
          # a duplicate or lower version has manufactured a bundle every cluster
          # will refuse — a broken release that looks successful here.
          latest="$(gh release list --limit 100 --json tagName --jq '[.[].tagName|select(startswith("catalog-v"))|ltrimstr("catalog-v")|tonumber]|max // 0')"
          echo "VERSION=$version, highest published=$latest"

          if [ "$version" -gt "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # version <= latest means there is nothing NEW to publish, because the
          # version IS the identity of a publish. Whether that is fine or a bug
          # depends entirely on what the commit touched:
          #
          #   corpus unchanged  a README or workflow edit. Normal, and the
          #                     common case — every docs merge lands here. This
          #                     used to fail the job, so main carried a red
          #                     publish for changes that had nothing to publish,
          #                     which is how a release job stops being read.
          #   corpus  changed   a real defect: tiles moved without a bump. The
          #                     `version` job in lint.yml catches this on a PR,
          #                     but a direct push to main never saw that gate.
          #
          # Mirrors lint.yml's own "only fires when tiles/ actually changed".
          if [ "$EVENT" != "push" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::VERSION ($version) is at or below the highest published catalog ($latest), and this run has no predecessor commit to prove the corpus is unchanged. Bump VERSION in a PR."
            exit 1
          fi
          # A force-push (or a GC'd predecessor) leaves BEFORE pointing at an
          # object this clone does not have. Say that, rather than dying on a
          # bare "bad object" and making a resolvable situation look like a bug.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::VERSION ($version) is at or below the highest published catalog ($latest), and the predecessor commit ($BEFORE) is not in this clone, so the corpus cannot be proven unchanged. Bump VERSION in a PR."
            exit 1
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- tiles/ VERSION; then
            echo "::notice::Nothing to publish: the corpus is unchanged and catalog v$latest is already released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::tiles/ changed but VERSION ($version) is not above the highest published catalog ($latest). A corpus change must bump VERSION."
          exit 1

      # The credential is staged and gated by the organisation's shared action
      # (geekdojo/geekdojo-brain#524), pinned by SHA. It runs the same checks
      # scripts/pki-init.sh --catalog-leaf runs at mint time, which is more than
      # this step did: the chain check alone would accept a leaf that had
      # quietly acquired codeSigning, or one missing the catalog OID entirely.
      #
      # The first is the whole of ADR-0006 Decision 3 -- a catalog key that
      # carries codeSigning can sign a RAUC bundle, which is precisely the
      # blast radius the separate leaf exists to prevent. The second is a leaf
      # artifactsig refuses, so every controlplane would reject the catalog
      # while CI called the release good.
      #
      # If the secrets are missing: the catalog leaf is DISTINCT from the
      # release leaf by design. It carries the catalog EKU and not generic
      # codeSigning, and is minted with scripts/pki-init.sh --catalog-leaf in
      # rasputin-control-plane.
      - name: Stage and preflight the signing credential
        id: stage
        if: steps.gate.outputs.publish == 'true'
        uses: geekdojo/.github/.github/actions/rasputin-sign@ecbad26a422f9adf8625a424c1b72c891a72a68c
        with:
          purpose: catalog
          leaf-key:  ${{ secrets.RASPUTIN_CATALOG_LEAF_KEY }}
          leaf-cert: ${{ secrets.RASPUTIN_CATALOG_LEAF_CERT }}
          root-ca:   ${{ vars.RASPUTIN_ROOT_CA_PEM }}

      - name: Build and sign
        if: steps.gate.outputs.publish == 'true'
        env:
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          go run ./cmd/catalogbundle -version "$version" -source "$SOURCE" -o catalog.json

          openssl cms -sign -binary \
            -in       catalog.json \
            -signer   ${{ steps.stage.outputs.leaf }} \
            -certfile ${{ steps.stage.outputs.intermediate }} \
            -inkey    ${{ steps.stage.outputs.key }} \
            -outform DER \
            -out      catalog.json.sig

          ls -l catalog.json catalog.json.sig

      # Prove the signature verifies BEFORE it is published. The action applies
      # `-purpose any` for the catalog class, which is required and is not
      # laziness: the catalog leaf carries only the catalog EKU, deliberately
      # NOT generic codeSigning (ADR-0006 Decision 3), and openssl's default
      # purpose check rejects a leaf on that basis alone.
      - name: Self-verify the signed catalog
        if: steps.gate.outputs.publish == 'true'
        uses: geekdojo/.github/.github/actions/rasputin-sign@ecbad26a422f9adf8625a424c1b72c891a72a68c
        with:
          mode: verify
          purpose: catalog
          artifacts: catalog.json

      - name: Wipe signing material
        if: always()
        uses: geekdojo/.github/.github/actions/rasputin-sign@ecbad26a422f9adf8625a424c1b72c891a72a68c
        with:
          mode: cleanup

      - name: Publish the release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # inputs.channel is empty on a push event, so default it: a push
          # always publishes to dev. channel=stable applies only to a VERSION
          # that is not yet published. Promoting a published version is a
          # flag flip on its release, not a dispatch (see CHANNELS in the
          # header).
          CHANNEL: ${{ inputs.channel || 'dev' }}
          # Every catalog-vN tag is created by this step, so --target always
          # applies: the tag lands on the commit that was built and signed.
          TARGET_SHA: ${{ steps.src.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          tag="catalog-v${version}"
          flag=""
          [ "$CHANNEL" = "stable" ] || flag="--prerelease"

          # Before publishing: the gate above compares VERSION with published
          # releases, not tags, so a stray catalog-vN tag on another commit
          # would make gh ignore --target and publish this bundle under it.
          # Refuse (status 1), and refuse if the remote cannot be read (2).
          # Status 3 (absent) is the normal case: this step creates the tag.
          created_tag=false
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$tag" "$TARGET_SHA" || rc=$?
          case "$rc" in
            0) ;;
            3) created_tag=true ;;
            *) echo "::error::refusing to publish $tag: see release-target-guard above"; exit 1 ;;
          esac

          # Notes go through a file, not an inline --notes string. A multi-line
          # argument written inline has to stay indented INSIDE this block
          # scalar; a line at column 0 silently ends the block and YAML then
          # tries to parse the prose as workflow keys. That is not theoretical
          # — it is how the first version of this file failed to load at all.
          # A quoted heredoc keeps the body literal and correctly indented.
          cat > /tmp/notes.md <<'NOTES'
          Signed catalog bundle.

          Verify it against the Rasputin root CA before trusting it:

              openssl cms -verify -binary -inform DER \
                -in catalog.json.sig -content catalog.json \
                -CAfile rasputin-root-ca.pem -purpose any

          `-purpose any` is required: the catalog leaf carries the catalog EKU and
          deliberately not generic codeSigning, so openssl's default purpose check
          rejects it on that basis alone.

          Root CA: https://rasputin.geekdojo.com/rasputin-root-ca.pem
          NOTES
          # Strip the leading indentation the block scalar required.
          sed -i 's/^          //' /tmp/notes.md

          # shellcheck disable=SC2086
          gh release create "$tag" $flag \
            --target "$TARGET_SHA" \
            --title "Rasputin App Catalog v${version}" \
            --notes-file /tmp/notes.md \
            catalog.json catalog.json.sig

          # After publishing: prove the tag landed on the built commit. A tag
          # this step created on the wrong commit is deleted with its release,
          # so no cluster can fetch a bundle whose tag names another commit. A
          # tag that already existed is never deleted. Only a proven mismatch
          # (1) deletes; an unreadable remote fails without touching the
          # release.
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$tag" "$TARGET_SHA" || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$rc" = 1 ] && [ "$created_tag" = true ]; then
              echo "::error::deleting release $tag and its tag: this run created them on the wrong commit"
              gh release delete "$tag" --cleanup-tag --yes \
                || echo "::error::could not delete release $tag; delete it and its tag by hand"
            fi
            exit 1
          fi
