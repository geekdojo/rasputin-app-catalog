name: Request an app
description: Ask for an app to be added to the Rasputin catalog.
title: "app request: "
labels: ["app-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an app.

        **What happens next.** A bot checks the request is complete and that the image
        really exists and runs on both architectures Rasputin ships. If it clears that,
        it is queued for evaluation — deployed on real Pi 5 and N100 hardware, measured,
        and scanned. Passing all of that is what earns a tile.

        Two things worth setting expectations on. Rasputin's catalog is **curated, not
        comprehensive** — a good app can still be declined because it does not fit the
        set. And an app that only ships an `amd64` image cannot be carried at all: half
        the fleet is arm64.
  - type: input
    id: app_id
    attributes:
      label: Proposed tile id
      description: >
        Lowercase letters, digits and hyphens only. This becomes part of the app's URL
        on a cluster (`<id>.<cluster>.internal`), so it is permanent once shipped —
        renaming one breaks the address of an app somebody already installed.
      placeholder: paperless-ngx
    validations: { required: true }
  - type: input
    id: name
    attributes:
      label: App name
      placeholder: Paperless-ngx
    validations: { required: true }
  - type: input
    id: image
    attributes:
      label: Container image
      description: >
        The published image, with a specific version tag — not `latest`. Multi-arch
        (linux/amd64 AND linux/arm64) is required; the bot verifies this against the
        registry rather than taking the tag's word for it.
      placeholder: ghcr.io/paperless-ngx/paperless-ngx:2.13.5
    validations: { required: true }
  - type: input
    id: upstream
    attributes:
      label: Upstream project
      description: Source repository, so licence and project health can be checked.
      placeholder: https://github.com/paperless-ngx/paperless-ngx
    validations: { required: true }
  - type: dropdown
    id: collection
    attributes:
      label: Which collection?
      options:
        - essentials (the credibility floor — every cluster should run it)
        - show-off (instant "whoa", no extra hardware)
        - everyday (useful; its absence would read as a gap)
        - dongle (needs a cheap SDR or similar)
        - not sure
    validations: { required: true }
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [ai, automation, data, games, media, monitoring, network, photos, productivity, radio, security, tools]
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Would you screenshot this and show someone?
      description: >
        The question the catalog is actually curated on. Say what a new owner sees in
        the first fifteen minutes — not the feature list, the moment it earns its place.
    validations: { required: true }
  - type: input
    id: hardware
    attributes:
      label: Hardware it needs (optional)
      description: Leave blank for pure software. Anything here means the tile carries a badge.
      placeholder: rtl-sdr
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The image publishes both linux/amd64 and linux/arm64
          required: true
        - label: It runs without an account, licence key, or paid feed to be useful
          required: false
        - label: It is safe on a LAN by default (does not expect to be internet-exposed)
          required: false
